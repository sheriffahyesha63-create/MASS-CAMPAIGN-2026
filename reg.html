<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Registration</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#111;
}

header{
    background:linear-gradient(90deg,#001f3f,#003366,#00509e);
    padding:18px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#fff;
}

footer{
    background:linear-gradient(90deg,#00509e,#003366,#001f3f);
    padding:12px;
    text-align:center;
    position:fixed;
    bottom:0;
    width:100%;
    color:#fff;
    font-size:13px;
}

.container{
    max-width:420px;
    margin:auto;
    padding:15px;
    padding-bottom:80px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#003366;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00509e;
}
</style>
</head>
<body>

<header>
Household Registration
</header>

<div class="container">
<div class="card">

<form id="regForm">

<label>Date</label>
<input type="date" id="regDate" required readonly>

<label>District</label>
<select id="district" required>
<option value="">Select District</option>
</select>

<label>Chiefdom</label>
<select id="chiefdom" required>
<option value="">Select Chiefdom</option>
</select>

<label>PHU</label>
<select id="phu" required>
<option value="">Select PHU</option>
</select>

<label>Community</label>
<select id="community" required>
<option value="">Select Community</option>
</select>

<label>Surname</label>
<input type="text" id="surname" required>

<label>First Name</label>
<input type="text" id="firstname" required>

<label>Middle Name</label>
<input type="text" id="middlename">

<label>Telephone Number</label>
<input type="tel" id="telephone" placeholder="0XXXXXXXX">

<label>Total Number of People in Household</label>
<input type="number" id="totalPeople" min="1" required>

<label>Number of Pregnant Women</label>
<input type="number" id="pregnantWomen" min="0" required>

<label>Number of Under Fives</label>
<input type="number" id="underFives" min="0" required>

<label>Name of Household Registrar</label>
<input type="text" id="registrar" required>

<label>Distribution Point</label>
<input type="text" id="distributionPoint" required>

<label>Generated Token</label>
<input type="text" id="token" readonly required>

<label>GPS Coordinates</label>
<input type="text" id="gps" readonly required>

<button type="submit">Register Household</button>

</form>

</div>
</div>

<footer>
ICF-SL @ 2026
</footer>

<script>

// AUTO DATE
document.getElementById('regDate').value =
new Date().toISOString().split('T')[0];

// GPS CAPTURE
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(
function(position){
document.getElementById('gps').value =
position.coords.latitude + ", " +
position.coords.longitude;
},
function(){
alert("Unable to capture GPS location.");
}
);
}

// TOKEN GENERATION
function generateToken(){
let surname=document.getElementById('surname').value.trim();
let firstname=document.getElementById('firstname').value.trim();
let phone=document.getElementById('telephone').value.trim();

document.getElementById('token').value =
surname + "_" + firstname + "_" + phone;
}

document.getElementById('surname').addEventListener('input',generateToken);
document.getElementById('firstname').addEventListener('input',generateToken);
document.getElementById('telephone').addEventListener('input',generateToken);

// PHONE VALIDATION
document.getElementById('telephone').addEventListener('blur',function(){

let phone=this.value.trim();

if(phone==="") return;

if(!/^0\d{8}$/.test(phone)){
alert("Telephone number must start with 0 and contain exactly 9 digits.");
this.value="";
this.focus();
}
});

// HOUSEHOLD VALIDATION
function validateHousehold(){

let total=parseInt(document.getElementById('totalPeople').value)||0;
let pregnant=parseInt(document.getElementById('pregnantWomen').value)||0;
let under5=parseInt(document.getElementById('underFives').value)||0;

if(pregnant > total){
alert("Pregnant women cannot exceed total household population.");
return false;
}

if(under5 > total){
alert("Under-fives cannot exceed total household population.");
return false;
}

return true;
}

// FORM SUBMIT
document.getElementById('regForm').addEventListener('submit',function(e){

if(!validateHousehold()){
e.preventDefault();
return;
}

alert("Household Registered Successfully");

});

// CASCADING CSV
let cascadeData=[];

fetch('cascading.csv')
.then(response=>response.text())
.then(text=>{

const rows=text.trim().split('\n').slice(1);

rows.forEach(row=>{

const cols=row.split(',');

cascadeData.push({
district:cols[0],
chiefdom:cols[1],
phu:cols[2],
community:cols[3]
});

});

loadDistricts();

});

function loadDistricts(){

const district=document.getElementById('district');

let districts=[...new Set(cascadeData.map(x=>x.district))];

districts.forEach(d=>{
district.add(new Option(d,d));
});

}

document.getElementById('district').addEventListener('change',function(){

let selected=this.value;

let chiefdom=document.getElementById('chiefdom');
chiefdom.innerHTML='<option value="">Select Chiefdom</option>';

document.getElementById('phu').innerHTML='<option value="">Select PHU</option>';
document.getElementById('community').innerHTML='<option value="">Select Community</option>';

let list=[...new Set(
cascadeData
.filter(x=>x.district===selected)
.map(x=>x.chiefdom)
)];

list.forEach(c=>{
chiefdom.add(new Option(c,c));
});

});

document.getElementById('chiefdom').addEventListener('change',function(){

let district=document.getElementById('district').value;
let chiefdom=this.value;

let phu=document.getElementById('phu');
phu.innerHTML='<option value="">Select PHU</option>';

document.getElementById('community').innerHTML='<option value="">Select Community</option>';

let list=[...new Set(
cascadeData
.filter(x=>x.district===district && x.chiefdom===chiefdom)
.map(x=>x.phu)
)];

list.forEach(p=>{
phu.add(new Option(p,p));
});

});

document.getElementById('phu').addEventListener('change',function(){

let district=document.getElementById('district').value;
let chiefdom=document.getElementById('chiefdom').value;
let phu=this.value;

let community=document.getElementById('community');
community.innerHTML='<option value="">Select Community</option>';

let list=[...new Set(
cascadeData
.filter(x=>x.district===district &&
x.chiefdom===chiefdom &&
x.phu===phu)
.map(x=>x.community)
)];

list.forEach(c=>{
community.add(new Option(c,c));
});

});

</script>

</body>
</html>
