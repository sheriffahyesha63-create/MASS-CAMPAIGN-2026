<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
    color:#111;
}

/* HEADER */
header{
    background: linear-gradient(90deg,#001f3f,#003366,#00509e);
    padding:18px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#ffffff;
}

/* FOOTER */
footer{
    background: linear-gradient(90deg,#00509e,#003366,#001f3f);
    padding:12px;
    text-align:center;
    position:fixed;
    bottom:0;
    width:100%;
    font-size:13px;
    color:#ffffff;
}

/* FORM CONTAINER */
.container{
    max-width:420px;
    margin:15px auto 80px auto;
    padding:15px;
}

/* INPUTS */
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background:#00509e;
    color:#fff;
    font-weight:bold;
}

/* ERROR */
.error{
    color:red;
    font-size:12px;
    margin-top:4px;
}
</style>
</head>

<body>

<header>
Registration Form
</header>

<div class="container">

<form id="regForm">

<!-- AUTO DATE -->
<label>Date</label>
<input type="text" id="date" readonly>

<!-- CASCADING -->
<label>District</label>
<select id="district"></select>

<label>Chiefdom</label>
<select id="chiefdom"></select>

<label>PHU</label>
<select id="phu"></select>

<label>Community</label>
<select id="community"></select>

<label>Household Head Name</label>
<input type="text" id="hhname">

<label>Telephone</label>
<input type="text" id="phone">
<div id="phoneError" class="error"></div>

<label>Total Household Members</label>
<input type="number" id="total">

<label>Pregnant Women</label>
<input type="number" id="pregnant">

<label>Under Five Children</label>
<input type="number" id="under5">
<div id="numError" class="error"></div>

<button type="submit">Submit</button>

</form>

</div>

<footer>
ICF-SL @ 2026
</footer>

<script>
// AUTO DATE
document.getElementById("date").value = new Date().toLocaleDateString();

// PHONE VALIDATION
document.getElementById("regForm").addEventListener("submit", function(e){
    let phone = document.getElementById("phone").value;
    let phoneError = document.getElementById("phoneError");

    let total = parseInt(document.getElementById("total").value || 0);
    let pregnant = parseInt(document.getElementById("pregnant").value || 0);
    let under5 = parseInt(document.getElementById("under5").value || 0);
    let numError = document.getElementById("numError");

    phoneError.textContent = "";
    numError.textContent = "";

    let valid = true;

    // PHONE RULE: 9 digits, starts with 0
    let phoneRegex = /^0\d{8}$/;
    if(!phoneRegex.test(phone)){
        phoneError.textContent = "Phone must be 9 digits and start with 0";
        valid = false;
    }

    // TOTAL VALIDATION RULE
    if(pregnant + under5 > total){
        numError.textContent = "Pregnant + Under 5 cannot exceed total household members";
        valid = false;
    }

    if(!valid){
        e.preventDefault();
    }
});

// CASCADING CSV (PLACEHOLDER STRUCTURE)
// You will later connect cascading.csv via fetch or server
// Structure expected: District → Chiefdom → PHU → Community

let cascadingData = [];

// Example loader (you will replace with real CSV file)
fetch("cascading.csv")
.then(res => res.text())
.then(data => {
    console.log("CSV Loaded (to be parsed):", data);
});
</script>

</body>
</html>
