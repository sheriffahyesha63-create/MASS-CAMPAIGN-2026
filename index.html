<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Collection Form</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
    color:#111;
}

/* HEADER */
header{
    background: linear-gradient(90deg,#001f3f,#003366,#00509e);
    padding:18px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#ffffff;
}

/* FOOTER */
footer{
    background: linear-gradient(90deg,#00509e,#003366,#001f3f);
    padding:12px;
    text-align:center;
    position:fixed;
    bottom:0;
    width:100%;
    font-size:13px;
    color:#ffffff;
}

/* MOBILE CONTAINER */
.card-container{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:15px;
    max-width:420px;
    margin:10px auto 70px auto;
}

/* CARD STYLE */
.card{
    background:#0b2a55;
    color:#ffffff;
    border-radius:12px;
    padding:18px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    text-decoration:none;
    display:block;
}

.card:active{
    transform:scale(0.98);
    background:#123a73;
}

</style>
</head>

<body>

<header>
Data Collection Form
</header>

<div class="card-container">

<a href="reg.html" class="card">Registration</a>
<a href="dist.html" class="card">Distribution</a>

<a href="attend.html" class="card">Attendance</a>

</div>

<footer>

</footer>

</html>
